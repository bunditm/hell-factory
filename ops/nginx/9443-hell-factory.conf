# Nginx configuration for Hell Factory on port 9443
# This is a standalone server block configuration

# Redirect HTTP → HTTPS (optional, if you want HTTP access too)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name _;  # Accept any hostname
#     return 301 https://$host:9443$request_uri;
# }

# Main HTTPS server on port 9443
server {
    listen 9443 ssl http2;
    listen [::]:9443 ssl http2;
    server_name _;  # Accept any hostname

    # === SSL Configuration ===
    # Adjust these paths to your SSL certificates
    ssl_certificate     /etc/ssl/cloudflare/allhoro.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/allhoro.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # === Limits ===
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 10s;

    # === Security: block sensitive files ===
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # === Main Hell Factory Route ===
    location /hell-factory/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (for Next.js dev mode if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # === SSE Endpoint - CRITICAL: No Buffering ===
    location /hell-factory/api/sse {
        proxy_pass http://127.0.0.1:3002/events;
        proxy_http_version 1.1;
        
        # SSE-specific headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CRITICAL: Disable connection upgrade for SSE
        proxy_set_header Connection '';
        
        # CRITICAL: Disable all buffering for SSE
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        
        # Long read timeout for SSE (24 hours)
        proxy_read_timeout 86400s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        
        # Ensure proper content type passes through
        proxy_set_header Content-Type $content_type;
        proxy_set_header Cache-Control "no-cache, no-store, must-revalidate";
        proxy_set_header Pragma "no-cache";
        proxy_set_header Expires "0";
    }

    # === Health Check Endpoint ===
    location /hell-factory/api/health {
        proxy_pass http://127.0.0.1:3002/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === Access Logs ===
    access_log /var/log/nginx/hell-factory-access.log;
    error_log /var/log/nginx/hell-factory-error.log;
}