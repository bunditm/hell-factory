# Nginx configuration for Hell Factory
# Routes /hell-factory/ to Next.js app on :3001
# Routes /hell-factory/api/sse to SSE stream on :3002 (no buffering)

# Main Next.js application route
location /hell-factory/ {
    proxy_pass http://127.0.0.1:3001/;
    proxy_http_version 1.1;
    
    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # WebSocket support (for Next.js dev mode if needed)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# SSE endpoint - CRITICAL: no buffering for real-time streaming
location /hell-factory/api/sse {
    proxy_pass http://127.0.0.1:3002/events;
    proxy_http_version 1.1;
    
    # SSE-specific headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # CRITICAL: Disable connection upgrade for SSE
    proxy_set_header Connection '';
    
    # CRITICAL: Disable all buffering for SSE
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    
    # Long read timeout for SSE (24 hours)
    proxy_read_timeout 86400s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    
    # Ensure proper content type passes through
    proxy_set_header Content-Type $content_type;
    proxy_set_header Cache-Control "no-cache, no-store, must-revalidate";
    proxy_set_header Pragma "no-cache";
    proxy_set_header Expires "0";
}

# Health check endpoint (optional, for monitoring)
location /hell-factory/api/health {
    proxy_pass http://127.0.0.1:3002/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}